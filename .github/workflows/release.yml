name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      crate_name: ${{ steps.release.outputs.crate_name }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${RELEASE_TAG_INPUT}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer: vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          version="${tag#v}"
          crate_name="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^name = / {
              gsub(/^name = "|"$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          manifest_version="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / {
              gsub(/^version = "|"$/, "")
              print
              exit
            }
          ' Cargo.toml)"
          lock_version="$(awk -v crate="${crate_name}" '
            /^\[\[package\]\]$/ { in_package = 0 }
            $0 == "name = \"" crate "\"" { in_package = 1 }
            in_package && /^version = / {
              gsub(/^version = "|"$/, "")
              print
              exit
            }
          ' Cargo.lock)"

          if [[ -z "${crate_name}" || -z "${manifest_version}" || -z "${lock_version}" ]]; then
            echo "Could not read package metadata from Cargo.toml and Cargo.lock" >&2
            exit 1
          fi
          if [[ "${version}" != "${manifest_version}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${manifest_version}" >&2
            exit 1
          fi
          if [[ "${version}" != "${lock_version}" ]]; then
            echo "Tag ${tag} does not match Cargo.lock version ${lock_version}" >&2
            exit 1
          fi
          spec_version="$(awk '$1 == "%global" && $2 == "fallback_version" { print $3; exit }' packaging/fedora/enzo.spec)"
          if [[ "${version}" != "${spec_version}" ]]; then
            echo "Tag ${tag} does not match Fedora spec version ${spec_version:-missing}" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "${tag} is not an existing Git tag" >&2
            exit 1
          fi

          commit="$(git rev-list -n 1 "${tag}")"
          if [[ "$(git rev-parse HEAD)" != "${commit}" ]]; then
            echo "The checked-out commit does not match ${tag}" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${commit}" FETCH_HEAD; then
            echo "The commit tagged ${tag} is not part of main" >&2
            exit 1
          fi

          {
            echo "commit=${commit}"
            echo "crate_name=${crate_name}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          awk -v version="${VERSION}" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          sed -i '/./,$!d' RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md has no release notes for ${VERSION}" >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ffmpeg \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libpulse-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config

      - name: Run release gate tests
        run: cargo test --locked

  linux:
    name: Build portable Linux release asset
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: debian:12-slim
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            git \
            gnutls-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            liblzma-dev \
            libpulse-dev \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            xz-utils \
            zlib1g-dev

      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Trust checked-out repository
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          "${HOME}/.cargo/bin/rustup" show active-toolchain

      - name: Build portable Linux binary
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          packaging/portable/linux/build.sh

      - name: Package portable Linux release asset
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          packaging/portable/linux/package.sh "${VERSION}"

      - name: Upload portable Linux release asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-asset-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  freebsd:
    name: Build portable FreeBSD release asset
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Build and package on FreeBSD 15.1
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            pkg update -f
            pkg install -y \
              bash binutils coreutils curl freetype2 fribidi git gmake gnutls gtar \
              harfbuzz meson nasm ninja pkgconf pulseaudio python3 rust
          run: |
            set -eu
            git config --global --add safe.directory "$(pwd)"
            packaging/portable/freebsd/build.sh
            packaging/portable/freebsd/package.sh "${{ needs.validate.outputs.version }}"

      - name: Upload portable FreeBSD release asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-asset-freebsd
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs:
      - validate
      - linux
      - freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-notes
          path: release-notes

      - name: Download portable Linux release asset
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-asset-linux
          path: dist

      - name: Download FreeBSD release asset
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-asset-freebsd
          path: dist

      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes/RELEASE_NOTES.md
          fi

  publish-crates:
    name: Publish crate
    needs:
      - validate
      - github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Check whether version exists on crates.io
        id: crates
        env:
          CRATE_NAME: ${{ needs.validate.outputs.crate_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          crate_name = os.environ["CRATE_NAME"]
          version = os.environ["VERSION"]
          url = f"https://crates.io/api/v1/crates/{crate_name}"

          try:
              with urllib.request.urlopen(url) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("published=false")
                  sys.exit(0)
              raise

          versions = {entry["num"] for entry in payload.get("versions", [])}
          if version in versions:
              print("published=true")
          else:
              print("published=false")
          PY

      - name: Install native dependencies
        if: steps.crates.outputs.published != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ffmpeg \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libpulse-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config

      - name: Authenticate with crates.io
        id: auth
        if: steps.crates.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Publish to crates.io
        if: steps.crates.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Skip crates.io publish
        if: steps.crates.outputs.published == 'true'
        env:
          CRATE_NAME: ${{ needs.validate.outputs.crate_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: echo "${CRATE_NAME} ${RELEASE_VERSION} is already published on crates.io"

  update-aur:
    name: Publish AUR package (${{ matrix.package.name }})
    needs:
      - validate
      - publish-crates
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: enzo
            repo: ssh://aur@aur.archlinux.org/enzo.git
            dir: aur-enzo
          - name: enzo-bin
            repo: ssh://aur@aur.archlinux.org/enzo-bin.git
            dir: aur-enzo-bin

    steps:
      - name: Install packaging tools
        shell: bash
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed \
            git \
            openssh \
            pacman-contrib
          useradd -m builder

      - name: Configure AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          known_hosts="$(mktemp)"
          ssh-keyscan -H aur.archlinux.org > "${known_hosts}"
          if [[ ! -s "${known_hosts}" ]]; then
            echo "Failed to fetch AUR SSH host keys" >&2
            exit 1
          fi
          mv "${known_hosts}" ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          {
            echo "Host aur.archlinux.org"
            echo "    HostName aur.archlinux.org"
            echo "    User aur"
            echo "    IdentityFile ${HOME}/.ssh/aur"
            echo "    IdentitiesOnly yes"
            echo "    UserKnownHostsFile ${HOME}/.ssh/known_hosts"
            echo "    StrictHostKeyChecking yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Clone AUR package repository
        env:
          AUR_REPO: ${{ matrix.package.repo }}
          AUR_DIR: ${{ matrix.package.dir }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -F ${HOME}/.ssh/config"
          git clone "${AUR_REPO}" "${AUR_DIR}"
          chown -R builder:builder "${AUR_DIR}"

      - name: Update PKGBUILD and .SRCINFO
        env:
          AUR_DIR: ${{ matrix.package.dir }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          runuser -u builder -- env \
            AUR_DIR="${AUR_DIR}" \
            RELEASE_VERSION="${RELEASE_VERSION}" \
            bash <<'BASH'
            set -euo pipefail
            cd "${AUR_DIR}"

            current_pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD | head -n1)"
            current_pkgrel="$(sed -n 's/^pkgrel=//p' PKGBUILD | head -n1)"
            if [[ -z "${current_pkgver}" || -z "${current_pkgrel}" ]]; then
              echo "Failed to read pkgver/pkgrel from ${AUR_DIR}/PKGBUILD" >&2
              exit 1
            fi
            if [[ ! "${current_pkgrel}" =~ ^[0-9]+$ ]]; then
              echo "Unsupported non-numeric pkgrel '${current_pkgrel}' in ${AUR_DIR}/PKGBUILD" >&2
              exit 1
            fi

            same_version=false
            target_pkgrel=1
            if [[ "${current_pkgver}" == "${RELEASE_VERSION}" ]]; then
              same_version=true
              target_pkgrel="${current_pkgrel}"
            fi

            update_pkgbuild() {
              local pkgrel="$1"
              sed -i "s/^pkgver=.*/pkgver=${RELEASE_VERSION}/" PKGBUILD
              sed -i "s/^pkgrel=.*/pkgrel=${pkgrel}/" PKGBUILD
              sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD

              for attempt in {1..12}; do
                if updpkgsums; then
                  break
                fi
                if [[ "${attempt}" -eq 12 ]]; then
                  echo "Failed to generate AUR checksum after 12 attempts" >&2
                  exit 1
                fi
                sleep 10
              done
              makepkg --printsrcinfo > .SRCINFO
            }

            update_pkgbuild "${target_pkgrel}"
            if [[ "${same_version}" == "true" ]] && ! git diff --quiet -- PKGBUILD .SRCINFO; then
              update_pkgbuild "$((current_pkgrel + 1))"
            fi
          BASH

      - name: Commit and push AUR update
        working-directory: ${{ matrix.package.dir }}
        env:
          AUR_PACKAGE: ${{ matrix.package.name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${PWD}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date"
            exit 0
          fi
          git commit -m "Update ${AUR_PACKAGE} to ${RELEASE_VERSION}"
          export GIT_SSH_COMMAND="ssh -F ${HOME}/.ssh/config"
          git push

  update-copr:
    name: Publish COPR package
    needs:
      - validate
      - publish-crates
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    container:
      image: fedora:43
    env:
      COPR_PROJECT: enzo

    steps:
      - name: Install COPR build tooling
        shell: bash
        run: |
          set -euxo pipefail
          dnf -y install \
            cargo \
            cpio \
            copr-cli \
            git \
            make \
            rpm-build \
            zstd

      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Trust checked-out repository
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${COPR_CONFIG:-}" ]]; then
            echo "COPR_CONFIG is not configured" >&2
            exit 1
          fi

          mkdir -p ~/.config
          printf '%s\n' "${COPR_CONFIG}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Build and submit COPR SRPM
        shell: bash
        run: |
          set -euo pipefail

          srpm_dir="$(mktemp -d)"
          trap 'rm -rf "${srpm_dir}"' EXIT

          make -f .copr/Makefile srpm \
            outdir="${srpm_dir}" \
            spec=packaging/fedora/enzo.spec \
            release=1

          srpm_path="$(find "${srpm_dir}" -maxdepth 1 -name '*.src.rpm' -print -quit)"
          if [[ -z "${srpm_path}" ]]; then
            echo "No source RPM was created in ${srpm_dir}" >&2
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          mkdir -p "${verify_dir}/SOURCES" "${verify_dir}/SPECS" "${verify_dir}/SRPMS"
          (
            cd "${verify_dir}"
            rpm2cpio "${srpm_path}" | cpio -idm --quiet
          )
          mv "${verify_dir}/enzo.spec" "${verify_dir}/SPECS/"
          mv "${verify_dir}/enzo-${{ needs.validate.outputs.version }}.tar.gz" \
            "${verify_dir}/vendor-${{ needs.validate.outputs.version }}.tar.zst" \
            "${verify_dir}/SOURCES/"
          rpmbuild -bs "${verify_dir}/SPECS/enzo.spec" \
            --define "_topdir ${verify_dir}" \
            --define "_srcrpmdir ${verify_dir}/SRPMS"

          copr-cli build "${COPR_PROJECT}" "${srpm_path}"

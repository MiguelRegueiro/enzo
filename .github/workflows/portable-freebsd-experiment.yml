name: Portable FreeBSD artifact experiment

on:
  push:
    branches:
      - experiment/portable-freebsd-15.1

permissions:
  contents: read

concurrency:
  group: portable-freebsd-15.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable FreeBSD 15.1 artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out experiment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and package on FreeBSD 15.1
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            pkg update -f
            pkg install -y \
              bash binutils coreutils curl freetype2 fribidi git gmake gnutls gtar \
              harfbuzz meson nasm ninja pkgconf pulseaudio rust xz
          run: |
            set -eu
            git config --global --add safe.directory "$(pwd)"
            packaging/portable/freebsd/build.sh
            packaging/portable/freebsd/package.sh 1.1.0

            archive="dist/enzo-1.1.0-x86_64-unknown-freebsd.tar.gz"
            test -f "${archive}"
            gzip -t "${archive}"
            gtar -tzf "${archive}" > dist/freebsd-portable-inventory.txt
            gsha256sum "${archive}" > dist/freebsd-portable-sha256.txt

      - name: Upload candidate for audit only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: enzo-1.1.0-portable-freebsd-15.1-candidate
          path: |
            dist/enzo-1.1.0-x86_64-unknown-freebsd.tar.gz
            dist/freebsd-portable-inventory.txt
            dist/freebsd-portable-sha256.txt
          if-no-files-found: error
          retention-days: 7

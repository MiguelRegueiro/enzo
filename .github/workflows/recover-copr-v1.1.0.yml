name: Recover COPR v1.1.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish corrected COPR package
    runs-on: ubuntu-latest
    environment: release
    container:
      image: fedora:43
    env:
      COPR_PROJECT: enzo

    steps:
      - name: Install COPR build tooling
        shell: bash
        run: |
          set -euxo pipefail
          dnf -y install cargo cpio copr-cli git make rpm-build zstd

      - name: Check out recovery source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: 6ff3e64dda1cb770b2249bb393e4a55e6a3c07c9

      - name: Trust checked-out repository
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Configure COPR credentials
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COPR_CONFIG:-}"
          mkdir -p ~/.config
          printf '%s\n' "${COPR_CONFIG}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Build, verify, and submit corrected SRPM
        shell: bash
        run: |
          set -euo pipefail
          srpm_dir="$(mktemp -d)"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "${srpm_dir}" "${verify_dir}"' EXIT

          make -f .copr/Makefile srpm \
            outdir="${srpm_dir}" \
            spec=packaging/fedora/enzo.spec \
            release=1

          srpm_path="$(find "${srpm_dir}" -maxdepth 1 -name 'enzo-1.1.0-*.src.rpm' -print -quit)"
          test -n "${srpm_path}"
          test "$(rpm -qp --qf '%{VERSION}' "${srpm_path}")" = "1.1.0"

          mkdir -p "${verify_dir}/SOURCES" "${verify_dir}/SPECS" "${verify_dir}/SRPMS"
          (
            cd "${verify_dir}"
            rpm2cpio "${srpm_path}" | cpio -idm --quiet
          )
          mv "${verify_dir}/enzo.spec" "${verify_dir}/SPECS/"
          mv "${verify_dir}/enzo-1.1.0.tar.gz" \
            "${verify_dir}/vendor-1.1.0.tar.zst" \
            "${verify_dir}/SOURCES/"
          rpmbuild -bs "${verify_dir}/SPECS/enzo.spec" \
            --define "_topdir ${verify_dir}" \
            --define "_srcrpmdir ${verify_dir}/SRPMS"

          copr-cli build "${COPR_PROJECT}" "${srpm_path}"

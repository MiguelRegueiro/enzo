name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu / fmt, clippy, test, docs, release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS: -Werror
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ffmpeg \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libharfbuzz-dev \
            libpulse-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features

      - name: Build release binary
        run: cargo build --locked --release --all-features

  freebsd:
    name: FreeBSD / test and release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1
        with:
          release: "14.4"
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
            pkg update -f
            pkg install -y rust ffmpeg pulseaudio freetype2 harfbuzz fribidi pkgconf
          run: |
            rustc --version
            cargo --version
            cargo test --locked --all-targets --all-features
            cargo build --locked --release --all-features

[package]
name = "enzo"
version = "1.1.0"
edition = "2024"
rust-version = "1.96"
description = "Terminal video player"
license = "MIT"
repository = "https://github.com/MiguelRegueiro/enzo"
keywords = ["video-player", "media-player", "terminal", "kitty", "ffmpeg"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.29"
dirs = "6"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
